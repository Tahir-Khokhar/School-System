{% extends "base.html" %}{% block content %}<h1 class="h3 fw-bold mb-3">Attendance Report</h1><div class="card"><div class="card-body p-0">{% if records %}<table class="table table-hover mb-0"><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Status</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ r.date|date:"M d, Y" }}</td><td>{{ r.student.full_name }}</td><td>{{ r.school_class.name }}</td><td><span class="badge {% if r.status == 'present' %}bg-soft-success{% elif r.status == 'absent' %}bg-soft-danger{% elif r.status == 'late' %}bg-soft-warning{% else %}bg-soft-info{% endif %}">{{ r.get_status_display }}</span></td></tr>{% endfor %}</tbody></table>{% else %}<div class="empty-state"><i class="bi bi-clipboard-data"></i></div>{% endif %}</div></div>{% endblock %}
