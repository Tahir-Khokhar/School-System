{% extends "base.html" %}
{% block content %}
<h1 class="h3 fw-bold mb-3">Generate Monthly Fee Challans</h1>
<div class="alert alert-info"><i class="bi bi-info-circle me-1"></i> Generates a challan for each active student in the selected class for the specified month. Already-generated challans are skipped (idempotent).</div>
<div class="card"><div class="card-body">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Class</label>
            <select name="school_class" class="form-select">
                <option value="">— All Active Classes —</option>
                {% for c in classes %}<option value="{{ c.pk }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>
        {{ form.month_label }}
        <button class="btn btn-primary mt-3"><i class="bi bi-magic me-1"></i>Generate Challans</button>
        <a href="{% url 'fees:challan_list' %}" class="btn btn-outline-secondary mt-3">Cancel</a>
    </form>
</div></div>
{% endblock %}
