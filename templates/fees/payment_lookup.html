{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container" style="max-width: 700px;">
<h1 class="h3 fw-bold mb-3"><i class="bi bi-credit-card me-2 text-primary"></i>Record Fee Payment</h1>
<div class="alert alert-info"><i class="bi bi-info-circle me-1"></i> Enter the challan number to retrieve the student and fee details automatically.</div>
<div class="card"><div class="card-body">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary btn-lg w-100"><i class="bi bi-search me-1"></i>Find Challan</button>
    </form>
</div></div>
</div>
{% endblock %}
