{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Forgot password? · {{ school_name }}{% endblock %}
{% block auth_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 100%);padding:1rem;">
  <div style="background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(13,61,18,.15);max-width:440px;width:100%;overflow:hidden;border:1px solid #e8f5e9;">
    <div style="background:#1b5e20;color:#fff;padding:1.25rem 1.5rem;text-align:center;">
      <h2 style="margin:0;font-size:1.3rem;font-weight:600;"><i class="bi bi-key me-2"></i>Forgot password?</h2>
      <div style="font-size:.8rem;opacity:.85;margin-top:.25rem;">Enter your email and we'll send you a reset link.</div>
    </div>
    <div style="padding:1.5rem;">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-aps-green w-100 btn-lg mt-3" style="background:#1b5e20;border-color:#1b5e20;color:#fff;font-weight:600;">
          <i class="bi bi-envelope me-2"></i>Send reset link
        </button>
      </form>
      <hr class="my-4">
      <div class="text-center">
        <a href="{% url 'login' %}" style="color:#1b5e20;text-decoration:none;font-size:.85rem;font-weight:600;">
          <i class="bi bi-arrow-left me-1"></i>Back to sign in
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
