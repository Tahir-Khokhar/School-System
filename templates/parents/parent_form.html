{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="h3 fw-bold mb-3">{% if object %}Edit Parent{% else %}New Parent{% endif %}</h1>
<div class="card"><div class="card-body">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary mt-3"><i class="bi bi-check-lg me-1"></i>Save</button>
        <a href="{% url 'parents:parent_list' %}" class="btn btn-outline-secondary mt-3">Cancel</a>
    </form>
</div></div>
{% endblock %}
