{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="h3 fw-bold mb-3">New Subject</h1>
<div class="card"><div class="card-body">
<form method="post">{% csrf_token %}{{ form|crispy }}
<div class="mt-3">
<button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
<a href="{% url 'common:subject_list' %}" class="btn btn-outline-secondary">Cancel</a>
</div></form>
</div></div>
{% endblock %}
